:root{--bg:#f7fafc;--bg2:#edf2f7;--card:#ffffff;--card-hover:#f0f4f8;--accent:#667eea;--accent2:#764ba2;--cyan:#4299e1;--text:#1a202c;--text2:#4a5568;--muted:#718096;--border:#e2e8f0;--tag-bg:rgba(102,126,234,0.1);--tag-text:#667eea;--green:#38a169;--yellow:#d69e2e;--red:#e53e3e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea,#764ba2);padding:60px 20px;text-align:center}
.header h1{font-size:2.5rem;font-weight:700;color:#ffffff;margin-bottom:8px}

.stats{display:flex;justify-content:center;gap:40px;margin-top:30px;flex-wrap:wrap}
.stat{text-align:center}.stat-num{font-size:2rem;font-weight:700;color:#ffffff}.stat-label{font-size:0.85rem;color:rgba(255,255,255,0.8)}
.container{max-width:1200px;margin:0 auto;padding:40px 20px}
.section-title{font-size:1.3rem;font-weight:600;color:var(--text);margin:30px 0 16px;padding-left:12px;border-left:4px solid var(--accent)}
.leaderboard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;margin-bottom:40px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.leaderboard h2{font-size:1.3rem;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.lb-table{width:100%;border-collapse:collapse}
.lb-table th{text-align:left;padding:12px 16px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:2px solid var(--border)}
.lb-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:0.9rem}

.lb-rank{font-weight:700;color:var(--accent);font-size:1.1rem;width:40px}
.lb-agent{font-weight:600;display:flex;align-items:center;gap:10px}
.lb-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.framework{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 30px;margin-bottom:30px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.framework h3{font-size:1.1rem;font-weight:600;margin-bottom:16px}
.fw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.fw-card p{font-size:0.82rem;color:var(--text2);line-height:1.5}
.fw-flow{font-family:monospace;font-size:0.8rem;color:var(--accent2);margin-top:6px;background:rgba(102,126,234,0.08);padding:4px 8px;border-radius:4px;display:inline-block}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden;transition:all 0.3s;box-shadow:0 2px 8px rgba(0,0,0,0.06)}

.card-header{padding:20px 24px;cursor:pointer;display:flex;align-items:center;gap:16px}
.task-icon{font-size:1.8rem;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--tag-bg);border-radius:12px}
.task-info{flex:1}
.task-num{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.chevron{color:var(--muted);font-size:1.1rem;transition:transform 0.3s}.chevron.open{transform:rotate(180deg)}

.task-questions{margin-bottom:16px}
.tq-item{margin-bottom:8px}
.tq-label{font-size:0.72rem;font-weight:600;color:var(--accent);letter-spacing:0.5px}
.tq-text{font-size:0.85rem;color:var(--text);margin-top:2px;line-height:1.6;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.results-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--border);font-size:0.85rem}
.results-table th{padding:10px 12px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);text-align:center}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtTokens(n){if(n===null||n===undefined)return '-';return n>=10000?(n/1000).toFixed(1)+'k':n.toLocaleString();}
function tokenDelta(before,after){
  if(!before||!after) return '';
  const pct=((after-before)/before*100).toFixed(0);
  if(pct<-5) return '<span class="delta delta-good">'+pct+'%</span>';
  if(pct>5) return '<span class="delta delta-bad">+'+pct+'%</span>';
  return '<span class="delta">'+pct+'%</span>';
}
function statusIcon(s){
  if(s==='completed') return '<span class="completed">\u2713</span>';
  if(s==='fail') return '<span class="failed" title="Failed">\u2717</span>';
  if(s==='timeout') return '<span class="timeout" title="执行超时了(15min)">\u23f1</span>';
  return '<span class="no-data" title="No data">-</span>';
}

    +'<div class="fw-card"><h4>Setting 4: Orthogonal-Similar (A\u2026B)</h4><p>Run task A, then 3 unrelated interference tasks, then similar task B. Measures transfer of learning to analogous tasks after distraction.</p><div class="fw-flow">A \u2192 [X\u2081, X\u2082, X\u2083] \u2192 B</div></div>'
    +'</div></div>';
}

function renderLeaderboard(){
  let agentScores = {};
  AGENTS.forEach(a=>{agentScores[a.id]={tokenReduction:0,tokenReductionCount:0,completionRate:0,completionRateCount:0,qualifiedTokens:0,qualifiedTaskCount:0};});
  function hasToken(n){
    return n!==null && n!==undefined && Number.isFinite(n);
  }
  function isQualified(s){ return s==='completed' || s==='timeout'; }

  function addScenario(score, runs, startRun, endRun){
    const validRuns = (runs||[]).filter(x=>x && x.status!=='no_data');
    // Completion rate uses all valid runs
    if(validRuns.length>0){
      const completed = validRuns.filter(x=>x.status==='completed').length;
      score.completionRate += completed/validRuns.length;
      score.completionRateCount += 1;
    }
    // Token stats: only count qualified (completed/timeout) runs
    const qualifiedRuns = validRuns.filter(x=>isQualified(x.status));
    let scenarioTokens = 0;
    let hasQualified = false;
    qualifiedRuns.forEach(x=>{
      if(hasToken(x.tokens)){ scenarioTokens += x.tokens; hasQualified = true; }
    });
    if(hasQualified){
      score.qualifiedTokens += scenarioTokens;
      score.qualifiedTaskCount += 1;
    }
    // Token reduction: only if both start and end runs are qualified
    const startOk = startRun && isQualified(startRun.status) && hasToken(startRun.tokens);
    const endOk = endRun && isQualified(endRun.status) && hasToken(endRun.tokens);
    if(startOk && endOk && startRun.tokens>0){
      score.tokenReduction += 1 - endRun.tokens/startRun.tokens;
      score.tokenReductionCount += 1;
    }
  }

  TASKS.forEach(t=>{
    AGENTS.forEach(a=>{
      const r=t.results[a.id];
      if(!r) return;
      addScenario(agentScores[a.id], r.aaa, r.aaa&&r.aaa[0]?r.aaa[0]:null, r.aaa&&r.aaa[2]?r.aaa[2]:null);
      addScenario(agentScores[a.id], r.abc, r.abc&&r.abc[0]?r.abc[0]:null, r.abc&&r.abc[2]?r.abc[2]:null);
      if(r.orthogonal_same){
        addScenario(agentScores[a.id], [r.orthogonal_same.task_a, r.orthogonal_same.task_b], r.orthogonal_same.task_a||null, r.orthogonal_same.task_b||null);
      }
      if(r.orthogonal_similar){
        addScenario(agentScores[a.id], [r.orthogonal_similar.task_a, r.orthogonal_similar.task_b], r.orthogonal_similar.task_a||null, r.orthogonal_similar.task_b||null);
      }
    });
  });
  let rankings = AGENTS.map(a=>{
    const s=agentScores[a.id];
    const avgR = s.tokenReductionCount>0 ? s.tokenReduction/s.tokenReductionCount : 0;
    const avgC = s.completionRateCount>0 ? s.completionRate/s.completionRateCount : 0;
    const avgTokenPerTask = s.qualifiedTaskCount>0 ? s.qualifiedTokens/s.qualifiedTaskCount : 0;
    return {...a, avgR, avgC, avgTokenPerTask};
  }).sort((a,b)=>b.avgR-a.avgR);
  let h='<div class="leaderboard"><h2>\ud83c\udfc6 Evolution Leaderboard</h2>';
  h+='<table class="lb-table"><thead><tr><th>Rank</th><th>Agent</th><th>Avg Token Reduction</th><th>Completion Rate</th><th>Avg Token per Task</th></tr></thead><tbody>';
  const gaR = rankings.find(x=>x.id==='generic_agent');
  const gaBaseline = gaR ? gaR.avgR : 0;
  rankings.forEach((r,i)=>{
    h+='<tr><td class="lb-rank">#'+(i+1)+'</td>';
    h+='<td><span class="lb-agent"><span class="lb-dot" style="background:'+r.color+'"></span>'+r.name+'</span></td>';
    let rCell = '<td style="font-weight:700">'+(r.avgR*100).toFixed(1)+'%';
    if(r.id!=='generic_agent' && gaBaseline>0){
      const diff = ((r.avgR - gaBaseline)*100).toFixed(1);
      rCell += ' <span style="font-size:0.8em;color:#888">('+diff+'pp vs GA)</span>';
    } else if(r.id==='generic_agent'){
      rCell += ' <span style="font-size:0.8em;color:#888">(baseline)</span>';
    }
    rCell += '</td>';
    h += rCell;
    h+='<td>'+(r.avgC*100).toFixed(1)+'%</td>';
    h+='<td>'+fmtTokens(r.avgTokenPerTask)+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<p style="font-size:0.75rem;color:var(--muted);margin-top:12px;padding-left:4px">* Avg Token Reduction 与 Avg Token per Task 仅统计状态为 Completed 或 Timeout 的运行数据，不包含 Failed 的结果。</p>';
  h+='</div>';
  return h;
}

  // Setting 2: ABC
  h+='<div class="setting-content" id="sc-'+i+'-1">';
  h+='<div class="setting-desc">Run main task A, then similar tasks B and C in sequence (Task A → Task B → Task C), not as isolated tasks. Measures transfer across similar tasks.</div>';
  h+='<table class="results-table"><thead><tr><th rowspan="2">Agent</th><th colspan="3">Sequential tasks: Task A → Task B → Task C</th></tr><tr><th>Task A (Step 1)</th><th>Task B (Step 2, after A)</th><th>Task C (Step 3, after B)</th></tr></thead><tbody>';
  AGENTS.forEach(a=>{
    const r=t.results[a.id];
    if(!r) return;
    const abc=r.abc;
    h+='<tr><td><span class="agent-badge"><span class="agent-dot" style="background:'+a.color+'"></span>'+a.name+'</span></td>';
    abc.forEach((run,ri)=>{
      if(!run||run.status==='no_data'||!run.tokens){
        h+='<td><span class="token-val">-</span></td>';
        return;
      }
      const cls = run.status==='timeout'?'timeout':(ri>0&&abc[0].tokens?(run.tokens<abc[0].tokens?'token-down':'token-up'):'token-same');
      h+='<td><span class="token-val '+cls+'">'+fmtTokens(run.tokens)+'</span> '+statusIcon(run.status);
      if(ri>0&&abc[0].tokens) h+=tokenDelta(abc[0].tokens,run.tokens);
      h+='</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  
  const orthogonalInterference = (INTERFERENCE_TASKS[t.num]||[]).map(n=>'Task '+n).join(' → ');

  // Setting 3: Orthogonal-Same (A → X → A)
  h+='<div class="setting-content" id="sc-'+i+'-2">';
  h+='<div class="setting-desc">Run task A, then 3 unrelated interference tasks, then run task A again in sequence (Task A → X1/X2/X3 → Task A), not as isolated columns. Measures retention of identical task after distraction.</div>';
  h+='<table class="results-table"><thead><tr><th rowspan="2">Agent</th><th colspan="3">Sequential flow: Task A → Interference Tasks → Task A</th></tr><tr><th>Task A (before)</th><th>Interference tasks (X1 → X2 → X3)</th><th>Task A (after interference)</th></tr></thead><tbody>';
  AGENTS.forEach(a=>{
    const r=t.results[a.id];
    if(!r||!r.orthogonal_same) return;
    const os=r.orthogonal_same;
    if(os.task_a.status==='no_data'&&os.task_b.status==='no_data') return;
    h+='<tr><td><span class="agent-badge"><span class="agent-dot" style="background:'+a.color+'"></span>'+a.name+'</span></td>';
    h+='<td><span class="token-val'+(os.task_a.status==='timeout'?' timeout':'')+'">'+fmtTokens(os.task_a.tokens)+'</span> '+statusIcon(os.task_a.status)+'</td>';
    h+='<td><span class="token-val">'+orthogonalInterference+'</span></td>';
    h+='<td><span class="token-val'+(os.task_b.status==='timeout'?' timeout':'')+'">'+fmtTokens(os.task_b.tokens)+'</span> '+statusIcon(os.task_b.status);
    if(os.task_a.tokens&&os.task_b.tokens) h+=tokenDelta(os.task_a.tokens,os.task_b.tokens);
    h+='</td></tr>';
  });
  h+='</tbody></table></div>';

  // Setting 4: Orthogonal-Similar (A → X → B)
  h+='<div class="setting-content" id="sc-'+i+'-3">';
  h+='<div class="setting-desc">Run task A, then 3 unrelated interference tasks, then run similar task B in sequence (Task A → X1/X2/X3 → Task B), not as isolated columns. Measures transfer of learning to analogous tasks after distraction.</div>';
  h+='<table class="results-table"><thead><tr><th rowspan="2">Agent</th><th colspan="3">Sequential flow: Task A → Interference Tasks → Task B</th></tr><tr><th>Task A (before)</th><th>Interference tasks (X1 → X2 → X3)</th><th>Task B (after interference)</th></tr></thead><tbody>';
  AGENTS.forEach(a=>{
    const r=t.results[a.id];
    if(!r||!r.orthogonal_similar) return;
    const os=r.orthogonal_similar;
    if(os.task_a.status==='no_data'&&os.task_b.status==='no_data') return;
    h+='<tr><td><span class="agent-badge"><span class="agent-dot" style="background:'+a.color+'"></span>'+a.name+'</span></td>';
    h+='<td><span class="token-val'+(os.task_a.status==='timeout'?' timeout':'')+'">'+fmtTokens(os.task_a.tokens)+'</span> '+statusIcon(os.task_a.status)+'</td>';
    h+='<td><span class="token-val">'+orthogonalInterference+'</span></td>';
    h+='<td><span class="token-val'+(os.task_b.status==='timeout'?' timeout':'')+'">'+fmtTokens(os.task_b.tokens)+'</span> '+statusIcon(os.task_b.status);
    if(os.task_a.tokens&&os.task_b.tokens) h+=tokenDelta(os.task_a.tokens,os.task_b.tokens);
    h+='</td></tr>';
  });
  h+='</tbody></table></div>';
  
  h+='</div></div>';
  return h;
}

function render(){
  let h = renderFramework();
  h += renderLeaderboard();
  h += '<div class="section-title">Task Groups · 评测持续更新中</div>';
  TASKS.forEach((t,i)=>{h+=renderTaskCard(t,i);});
  app.innerHTML = h;
}
function toggle(i){
  document.getElementById('body-'+i).classList.toggle('open');
  document.getElementById('chev-'+i).classList.toggle('open');
}
function switchSetting(ti,si){
  const card=document.getElementById('task-'+TASKS[ti].num);
  card.querySelectorAll('.stab').forEach((t,idx)=>t.classList.toggle('active',idx===si));
  card.querySelectorAll('.setting-content').forEach((c,idx)=>c.classList.toggle('active',idx===si));
}
render();

</script>
</body>
</html>
